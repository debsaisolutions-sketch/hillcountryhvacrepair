name: Homepage guard

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fail on missing homepage assets, 555 numbers, or placeholder forms
        run: python3 scripts/check-homepage.py
      - name: Lead form posts with a mocked fetch only
        run: node scripts/test-leads.mjs
